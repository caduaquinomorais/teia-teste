; php.ini de DESENVOLVIMENTO (usado por bin/php.sh quando o PHP não tem php.ini próprio).
; Não é usado em produção.
extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=fileinfo
extension=openssl
extension=gd
extension=zip
extension=sodium
extension=curl
display_errors=Off
log_errors=On
error_reporting=E_ALL
memory_limit=256M
upload_max_filesize=12M
post_max_size=40M
expose_php=Off
date.timezone=America/Sao_Paulo
zend.assertions=1
