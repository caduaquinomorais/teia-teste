; php.ini de DESENVOLVIMENTO (usado por bin/php.sh quando o PHP não tem php.ini próprio).
; Não é usado em produção. O site em si só usa o núcleo do PHP; as extensões abaixo
; servem às ferramentas de desenvolvimento (gd: bin/preparar-assets.php; curl: testes HTTP).
extension=mbstring
extension=gd
extension=curl
extension=openssl
display_errors=Off
log_errors=On
error_reporting=E_ALL
memory_limit=256M
expose_php=Off
date.timezone=America/Sao_Paulo
zend.assertions=1
